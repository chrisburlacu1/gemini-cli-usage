name: Release Extension

on:
  push:
    tags:
      - "v*" # Trigger on any tag starting with "v" (e.g. v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create the release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      # Create a clean folder for the release artifact
      - name: Prepare Release Artifact
        run: |
          mkdir release-artifact
          cp -r dist release-artifact/
          cp -r commands release-artifact/
          cp package.json release-artifact/
          cp gemini-extension.json release-artifact/
          cp README.md release-artifact/
          cp LICENSE release-artifact/
          cp GEMINI.md release-artifact/

      # Pack it into a .tar.gz (Gemini CLI likes these)
      - name: Compress Artifact
        run: |
          cd release-artifact
          tar -czvf ../extension.tar.gz .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: extension.tar.gz
          generate_release_notes: true
